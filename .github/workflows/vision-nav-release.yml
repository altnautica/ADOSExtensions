name: vision-nav-release

on:
  push:
    tags:
      - "vision-nav-v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag
        id: route
        run: |
          tag="${GITHUB_REF_NAME}"
          # Tag form: vision-nav-v<semver>
          version="${tag##*-v}"
          echo "ext=vision-nav" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile=false
          pip install cryptography

      - name: Build GCS bundle
        run: pnpm --filter "./extensions/${{ steps.route.outputs.ext }}/gcs" build

      - name: Run GCS tests
        run: pnpm --filter "./extensions/${{ steps.route.outputs.ext }}/gcs" test

      - name: Install vision-nav agent for testing
        run: |
          cd extensions/${{ steps.route.outputs.ext }}/agent
          pip install -e .[dev]

      - name: Run vision-nav agent tests
        run: |
          cd extensions/${{ steps.route.outputs.ext }}/agent
          pytest tests -ra

      - name: Build agent wheel
        run: |
          cd extensions/${{ steps.route.outputs.ext }}/agent
          pip install build
          python -m build --wheel --outdir ../dist

      # TODO(founder): vision-nav-vendor-binaries.yml triggers on the same
      # vision-nav-v* tag and runs in parallel with this workflow, so the
      # vendor-binary tarballs are not guaranteed to exist on the runner
      # when pack.sh runs. Options to resolve:
      #   (a) switch this workflow to `on: workflow_run` of vendor-binaries,
      #   (b) add a polling/download step that fetches the matching
      #       vendor-binaries run artifacts via the GitHub API, or
      #   (c) merge both workflows into a single multi-job pipeline.
      # Until then, the presence check below will fail the release when the
      # vendor binaries are absent, which is the safer default (refuse to
      # ship an .adosplug missing its allowlisted shim binaries).
      - name: Stage vendor binaries from sibling workflow
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: extensions/${{ steps.route.outputs.ext }}/vendor/_staged
          pattern: "*-*-unknown-linux-gnu"
          merge-multiple: true

      - name: Extract staged vendor tarballs
        if: hashFiles(format('extensions/{0}/vendor/_staged/**/*.tar.gz', steps.route.outputs.ext)) != ''
        run: |
          set -e
          staged_dir="extensions/${{ steps.route.outputs.ext }}/vendor/_staged"
          for tarball in $(find "${staged_dir}" -name '*.tar.gz' 2>/dev/null); do
            target_dir="extensions/${{ steps.route.outputs.ext }}/vendor/$(basename "${tarball}" .tar.gz)"
            mkdir -p "${target_dir}"
            tar -xzf "${tarball}" -C "${target_dir}"
            echo "extracted ${tarball} -> ${target_dir}"
          done

      - name: Verify vendor binaries present
        run: |
          set -e
          missing=0
          for binary in ados_openvins_shim ados_vins_fusion_shim; do
            if ! find extensions/${{ steps.route.outputs.ext }} -name "${binary}" -type f 2>/dev/null | grep -q .; then
              echo "::error::Missing vendor binary: ${binary}"
              missing=$((missing + 1))
            else
              echo "Found: $(find extensions/${{ steps.route.outputs.ext }} -name "${binary}" -type f | head -1)"
            fi
          done
          if [ ${missing} -gt 0 ]; then
            echo "::error::${missing} vendor binary(ies) missing. Run vision-nav-vendor-binaries.yml workflow first to produce them."
            exit 1
          fi

      - name: Pack archive
        run: ./scripts/pack.sh "${{ steps.route.outputs.ext }}"

      - name: Sign archive
        env:
          ADOS_SIGNING_KEY: ${{ secrets.ADOS_SIGNING_KEY }}
          ADOS_SIGNING_KEY_INLINE: "1"
          ADOS_SIGNING_KEY_ID: ${{ secrets.ADOS_SIGNING_KEY_ID }}
        run: |
          archive="extensions/${{ steps.route.outputs.ext }}/dist/$(ls extensions/${{ steps.route.outputs.ext }}/dist | grep -E '\.adosplug$' | head -n1)"
          ./scripts/sign.sh "${archive}"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extensions/${{ steps.route.outputs.ext }}/dist/*.signed.adosplug
            extensions/${{ steps.route.outputs.ext }}/CHANGELOG.md
