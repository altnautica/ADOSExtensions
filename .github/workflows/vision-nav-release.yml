# vision-nav-release
#
# End-to-end pipeline that fires on a `vision-nav-v*` tag push:
#   1. `vendor-binaries` matrix job builds the OpenVINS and VINS-Fusion shim
#      binaries for every supported target. Artifacts are uploaded as same-run
#      artifacts (no cross-run download dance).
#   2. `build-and-release` waits on the matrix via `needs:`, downloads the
#      vendor-binary tarballs, runs the agent + GCS tests, packs and signs the
#      .adosplug archive, and attaches both the .adosplug and the vendor
#      tarballs to the GitHub Release.
#
# Consolidating both halves into one workflow removes the cross-workflow
# artifact download race the previous split-workflow design had: the release
# job no longer needs to guess which run produced the vendor binaries, because
# they live in the same run.
#
# The standalone `vision-nav-vendor-binaries.yml` workflow is kept for manual
# rebuilds via `workflow_dispatch` (founder can rebuild vendor binaries against
# any commit ref without cutting a release tag) but no longer fires on tag
# pushes; the release pipeline below owns the on-tag path end to end.

name: vision-nav-release

on:
  push:
    tags:
      - "vision-nav-v*"

jobs:
  vendor-binaries:
    name: build ${{ matrix.binary }} (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        binary: [openvins, vins-fusion]
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
        # The rockchip-specific aarch64 variant builds against a
        # different sysroot (Radxa BSP libc + OpenCV pins). The
        # bench validation gate adds it back once the Rock 5C Lite
        # sysroot drops are mirrored.
        # - aarch64-rockchip-linux-gnu
    env:
      BINARY_DIR: extensions/vision-nav/vendor/${{ matrix.binary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential git \
            crossbuild-essential-arm64

      - name: Install sysroot dependencies
        # The aarch64 sysroot needs Eigen, OpenCV, Boost, msgpack,
        # plus Ceres for the VINS-Fusion build. The GitHub-hosted
        # runner's default Ubuntu mirror only carries amd64 + i386;
        # arm64 packages live on ports.ubuntu.com. Restrict existing
        # sources to amd64 so apt stops 404ing on arm64 index fetches,
        # then add the ports mirror for the arm64 architecture before
        # the post-add-architecture apt-get update.
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo sed -i 's|^deb http|deb [arch=amd64] http|g' /etc/apt/sources.list
            sudo find /etc/apt/sources.list.d/ -name '*.list' \
              -exec sudo sed -i 's|^deb http|deb [arch=amd64] http|g' {} +
            sudo tee /etc/apt/sources.list.d/ports.list >/dev/null <<'PORTS'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-backports main restricted universe multiverse
          PORTS
            sudo dpkg --add-architecture arm64
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libeigen3-dev:arm64 libopencv-dev:arm64 \
              libboost-all-dev:arm64 libmsgpack-cxx-dev:arm64 \
              libceres-dev:arm64 libgoogle-glog-dev:arm64 libgflags-dev:arm64
          else
            sudo apt-get install -y --no-install-recommends \
              libeigen3-dev libopencv-dev libboost-all-dev \
              libmsgpack-cxx-dev libceres-dev \
              libgoogle-glog-dev libgflags-dev
          fi

      - name: Configure
        working-directory: ${{ env.BINARY_DIR }}
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=/usr/bin/aarch64-linux-gnu-gcc \
              -DCMAKE_CXX_COMPILER=/usr/bin/aarch64-linux-gnu-g++ \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        working-directory: ${{ env.BINARY_DIR }}
        run: cmake --build build -j$(nproc) --verbose

      - name: Conformance (x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: ${{ env.BINARY_DIR }}
        run: |
          binary_name="ados_$(echo ${{ matrix.binary }} | tr '-' '_')_shim"
          # Capture stderr so we can distinguish the intentional
          # "not yet implemented" scaffold exit from a real
          # crash. The grep check is the conformance gate until the
          # upstream integration lands and the binary returns 0.
          set +e
          ./build/${binary_name} --conformance 2> conformance.log
          status=$?
          set -e
          cat conformance.log
          if grep -q "not yet implemented" conformance.log; then
            echo "scaffold exit accepted"
            exit 0
          fi
          exit $status

      - name: Sign artefact
        working-directory: ${{ env.BINARY_DIR }}
        env:
          ADOS_SIGNING_KEY: ${{ secrets.ADOS_SIGNING_KEY }}
        run: |
          binary_name="ados_$(echo ${{ matrix.binary }} | tr '-' '_')_shim"
          out="build/${binary_name}-${{ matrix.target }}.tar.gz"
          tar -czf "$out" -C build "$binary_name"
          if [ -n "$ADOS_SIGNING_KEY" ]; then
            echo "$ADOS_SIGNING_KEY" > /tmp/signing.key
            python3 -m pip install --quiet cryptography
            python3 - "$out" /tmp/signing.key <<'PY'
          import base64, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          payload = open(sys.argv[1], "rb").read()
          key = load_pem_private_key(open(sys.argv[2], "rb").read(), password=None)
          assert isinstance(key, Ed25519PrivateKey)
          sig = key.sign(payload)
          open(sys.argv[1] + ".sig", "wb").write(base64.b64encode(sig))
          PY
          else
            echo "ADOS_SIGNING_KEY not set; skipping signature"
          fi

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.target }}
          path: |
            ${{ env.BINARY_DIR }}/build/*.tar.gz
            ${{ env.BINARY_DIR }}/build/*.tar.gz.sig

  build-and-release:
    needs: vendor-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag
        id: route
        run: |
          tag="${GITHUB_REF_NAME}"
          # Tag form: vision-nav-v<semver>
          version="${tag##*-v}"
          echo "ext=vision-nav" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile=false
          pip install cryptography

      - name: Build workspace SDK
        run: pnpm --filter @altnautica/plugin-sdk build

      - name: Build GCS bundle
        run: pnpm --filter "./extensions/${{ steps.route.outputs.ext }}/gcs" build

      - name: Run GCS tests
        run: pnpm --filter "./extensions/${{ steps.route.outputs.ext }}/gcs" test

      - name: Install vision-nav agent for testing
        run: |
          cd extensions/${{ steps.route.outputs.ext }}/agent
          pip install -e .[dev]

      - name: Run vision-nav agent tests
        run: |
          cd extensions/${{ steps.route.outputs.ext }}/agent
          pytest tests -ra

      - name: Build agent wheel
        run: |
          cd extensions/${{ steps.route.outputs.ext }}/agent
          pip install build
          python -m build --wheel --outdir ../dist

      - name: Stage vendor binaries from matrix
        # Vendor binaries are produced by the `vendor-binaries` job in this
        # same run. `needs:` guarantees they exist; the download step pulls
        # every matrix artifact into one directory.
        uses: actions/download-artifact@v4
        with:
          path: extensions/${{ steps.route.outputs.ext }}/vendor/_staged
          pattern: "*-*-unknown-linux-gnu"
          merge-multiple: true

      - name: Extract staged vendor tarballs
        run: |
          set -e
          staged_dir="extensions/${{ steps.route.outputs.ext }}/vendor/_staged"
          if [ ! -d "${staged_dir}" ]; then
            echo "::error::Vendor staging directory missing: ${staged_dir}"
            exit 1
          fi
          shopt -s nullglob
          found=0
          while IFS= read -r tarball; do
            target_dir="extensions/${{ steps.route.outputs.ext }}/vendor/$(basename "${tarball}" .tar.gz)"
            mkdir -p "${target_dir}"
            tar -xzf "${tarball}" -C "${target_dir}"
            echo "extracted ${tarball} -> ${target_dir}"
            found=$((found + 1))
          done < <(find "${staged_dir}" -name '*.tar.gz' 2>/dev/null)
          if [ "${found}" -eq 0 ]; then
            echo "::error::No vendor tarballs found under ${staged_dir}"
            exit 1
          fi

      - name: Verify vendor binaries present
        run: |
          set -e
          missing=0
          for binary in ados_openvins_shim ados_vins_fusion_shim; do
            if ! find extensions/${{ steps.route.outputs.ext }} -name "${binary}" -type f 2>/dev/null | grep -q .; then
              echo "::error::Missing vendor binary: ${binary}"
              missing=$((missing + 1))
            else
              echo "Found: $(find extensions/${{ steps.route.outputs.ext }} -name "${binary}" -type f | head -1)"
            fi
          done
          if [ ${missing} -gt 0 ]; then
            echo "::error::${missing} vendor binary(ies) missing despite vendor-binaries matrix completing. Inspect the matrix job logs."
            exit 1
          fi

      - name: Pack archive
        run: ./scripts/pack.sh "${{ steps.route.outputs.ext }}"

      - name: Sign archive
        env:
          ADOS_SIGNING_KEY: ${{ secrets.ADOS_SIGNING_KEY }}
          ADOS_SIGNING_KEY_INLINE: "1"
          ADOS_SIGNING_KEY_ID: ${{ secrets.ADOS_SIGNING_KEY_ID }}
        run: |
          archive="extensions/${{ steps.route.outputs.ext }}/dist/$(ls extensions/${{ steps.route.outputs.ext }}/dist | grep -E '\.adosplug$' | head -n1)"
          ./scripts/sign.sh "${archive}"

      - name: Stage vendor tarballs for release upload
        run: |
          set -e
          staged_dir="extensions/${{ steps.route.outputs.ext }}/vendor/_staged"
          release_dir="extensions/${{ steps.route.outputs.ext }}/dist/vendor-tarballs"
          mkdir -p "${release_dir}"
          find "${staged_dir}" \( -name '*.tar.gz' -o -name '*.tar.gz.sig' \) \
            -exec cp -v {} "${release_dir}/" \;

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extensions/${{ steps.route.outputs.ext }}/dist/*.signed.adosplug
            extensions/${{ steps.route.outputs.ext }}/dist/vendor-tarballs/*.tar.gz
            extensions/${{ steps.route.outputs.ext }}/dist/vendor-tarballs/*.tar.gz.sig
            extensions/${{ steps.route.outputs.ext }}/CHANGELOG.md
