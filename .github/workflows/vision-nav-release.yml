# vision-nav-release
#
# Fires on a `vision-nav-v*` tag push: builds the GCS bundle, runs its tests,
# cross-compiles the Rust agent binary against the pinned agent SDK revision,
# then packs, signs, and attaches the .adosplug archive to the GitHub Release.
#
# The extension ships no third-party binaries, so there is no vendor-build
# matrix and nothing to stage into the archive beyond the agent binary and the
# GCS bundle.

name: vision-nav-release

on:
  push:
    tags:
      - "vision-nav-v*"

jobs:
  build-and-release:
    # Native arm64 so the agent binary cross-compiles to the static
    # aarch64-unknown-linux-musl target with musl-tools (one binary runs on
    # every supported board regardless of glibc).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      # The agent SDK crates (ados-sdk / ados-protocol) are consumed via the
      # workspace path dep `{ path = "../ADOSDroneAgent/crates/..." }`, so the
      # sibling repo is cloned before the crate builds. The revision comes from
      # the committed ADOS_AGENT_REV file, so re-running this tag builds against
      # the same SDK commit.
      ADOS_AGENT_REPO: https://github.com/altnautica/ADOSDroneAgent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag
        id: route
        run: |
          tag="${GITHUB_REF_NAME}"
          # Tag form: vision-nav-v<semver>
          version="${tag##*-v}"
          echo "ext=vision-nav" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile=false
          pip install cryptography

      - name: Build workspace SDK
        run: pnpm --filter @altnautica/plugin-sdk build

      - name: Build GCS bundle
        run: pnpm --filter "./extensions/${{ steps.route.outputs.ext }}/gcs" build

      - name: Run GCS tests
        run: pnpm --filter "./extensions/${{ steps.route.outputs.ext }}/gcs" test

      - name: Check out the agent SDK at the pinned revision
        run: |
          set -e
          rev="$(cat ADOS_AGENT_REV)"
          dest="${GITHUB_WORKSPACE}/../ADOSDroneAgent"
          git clone --filter=blob:none "${ADOS_AGENT_REPO}" "${dest}"
          git -C "${dest}" checkout "${rev}"
          echo "agent SDK pinned at ADOSDroneAgent@$(git -C "${dest}" rev-parse --short HEAD)"

      - name: Install Rust toolchain (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl cross tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Pack archive
        # pack-rust.sh cross-compiles the agent binary (bin/vision-nav) via
        # scripts/build-rust.sh, stages it + the GCS bundle, and refuses to pack
        # a half-archive missing the agent.entrypoint.
        run: ./scripts/pack-rust.sh "${{ steps.route.outputs.ext }}" aarch64-unknown-linux-musl

      - name: Sign archive
        env:
          # Same first-party key as release.yml so a single public half
          # (/etc/ados/plugin-keys/altnautica-2026-A.pem) verifies every plugin.
          ADOS_SIGNING_KEY: ${{ secrets.ALTNAUTICA_PLUGIN_KEY_A }}
          ADOS_SIGNING_KEY_INLINE: "1"
          ADOS_SIGNING_KEY_ID: altnautica-2026-A
        run: |
          archive="extensions/${{ steps.route.outputs.ext }}/dist/$(ls extensions/${{ steps.route.outputs.ext }}/dist | grep -E '\.adosplug$' | head -n1)"
          ./scripts/sign.sh "${archive}"

      - name: Assert signer id is first-party
        run: |
          signed="extensions/${{ steps.route.outputs.ext }}/dist/$(ls extensions/${{ steps.route.outputs.ext }}/dist | grep -E '\.signed\.adosplug$' | head -n1)"
          signer=$(unzip -p "${signed}" SIGNATURE | head -n1)
          case "${signer}" in
            altnautica-2026-A|altnautica-2026-B)
              echo "OK: signer ${signer}"
              ;;
            *)
              echo "ERROR: signer '${signer}' is not in the first-party allowlist" >&2
              exit 1
              ;;
          esac

      - name: Emit SHA-256 checksum
        run: |
          signed="extensions/${{ steps.route.outputs.ext }}/dist/$(ls extensions/${{ steps.route.outputs.ext }}/dist | grep -E '\.signed\.adosplug$' | head -n1)"
          digest=$(shasum -a 256 "${signed}" | awk '{print $1}')
          printf '%s  %s\n' "${digest}" "$(basename "${signed}")" > "${signed}.sha256"
          cat "${signed}.sha256"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extensions/${{ steps.route.outputs.ext }}/dist/*.signed.adosplug
            extensions/${{ steps.route.outputs.ext }}/dist/*.signed.adosplug.sha256
            extensions/${{ steps.route.outputs.ext }}/CHANGELOG.md
