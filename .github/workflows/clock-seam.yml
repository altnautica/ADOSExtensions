name: Clock seam

# The files listed in scripts/clock-seam-allow.txt run on ADOS time (the
# simulator's clock when the node follows it); a wall-clock read or timer
# added to one would run at 1x under a simulator at Nx.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  clock-seam:
    name: Code on ADOS time keeps off the wall clock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check catches a planted wall-clock read
        run: python scripts/check-clock-seam.py --self-test

      - name: Files on ADOS time keep off the wall clock
        run: python scripts/check-clock-seam.py
