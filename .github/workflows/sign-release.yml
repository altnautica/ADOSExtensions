name: sign-release

# Sign and publish an extension release.
#
# Trigger: push a tag of the form `extensions/<extension>-v<semver>`,
# e.g. `extensions/vision-nav-v0.2.3`. The tag namespace is distinct
# from the older `<extension>-v*` tag form used by `release.yml` and
# `vision-nav-release.yml`; the two patterns coexist so a release
# manager can pick whichever pipeline matches the situation.
#
# This workflow uses the `ados plugin sign` CLI shipped by the drone
# agent (installed via PyPI in the future; currently sourced from the
# pinned ADOSDroneAgent submodule path under ./vendor if present, or
# from git if not). If your fork of ADOSExtensions does not vendor the
# SDK, set the env var SDK_GIT_URL to your fork's URL before pushing
# the tag.
#
# Required GitHub Actions secrets:
#   ALTNAUTICA_PLUGIN_KEY_A   base64-encoded Ed25519 private key (PEM)
#                             for signer id altnautica-2026-A. The
#                             workflow pipes it through `base64 -d`
#                             into a tempfile, signs, and wipes.

on:
  push:
    tags:
      - "extensions/*-v*"

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/extensions/}"
          NAME="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install plugin signing SDK
        # The `ados plugin sign` subcommand lives in the drone agent
        # package. Install the agent from PyPI when a stable release
        # is published; until then, fall back to installing from git.
        # Decision point: switch SDK_GIT_URL to `pip install ados-drone-agent`
        # once the agent ships a PyPI release that includes the sign
        # subcommand.
        env:
          SDK_GIT_URL: https://github.com/altnautica/ADOSDroneAgent.git
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+${SDK_GIT_URL}"

      - name: Verify ados CLI is on PATH
        run: |
          which ados
          ados plugin --help | head -5

      - name: Write signing key
        env:
          ADOS_SIGNING_KEY_B64: ${{ secrets.ALTNAUTICA_PLUGIN_KEY_A }}
        run: |
          umask 077
          mkdir -p .signing-keys
          echo "$ADOS_SIGNING_KEY_B64" | base64 -d \
              > .signing-keys/altnautica-2026-A.priv.pem
          chmod 600 .signing-keys/altnautica-2026-A.priv.pem

      - name: Pack and sign archive
        run: |
          OUT="dist/com.altnautica.${{ steps.parse.outputs.name }}-${{ steps.parse.outputs.version }}.signed.adosplug"
          mkdir -p dist
          ados plugin sign "extensions/${{ steps.parse.outputs.name }}" \
              --key .signing-keys/altnautica-2026-A.priv.pem \
              --signer-id altnautica-2026-A \
              --output "$OUT"
          ls -l "$OUT" "$OUT.sha256"

      - name: Clean up signing key
        if: always()
        run: rm -rf .signing-keys

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.signed.adosplug
            dist/*.sha256
