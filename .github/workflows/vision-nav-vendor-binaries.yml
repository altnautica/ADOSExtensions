name: vision-nav vendor binaries

# Manual-only workflow for rebuilding OpenVINS / VINS-Fusion shim binaries
# against an arbitrary commit ref without cutting a release tag. The on-tag
# path is owned end-to-end by vision-nav-release.yml, which runs the same
# matrix as an upstream job and consumes the artifacts in the same run; this
# file used to also trigger on `vision-nav-v*` tag pushes which produced a
# parallel run whose artifacts the release workflow could not reliably reach.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Override the commit ref the binaries build against"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.binary }} (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        binary: [openvins, vins-fusion]
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
        # The rockchip-specific aarch64 variant builds against a
        # different sysroot (Radxa BSP libc + OpenCV pins). The
        # bench validation gate adds it back once the Rock 5C Lite
        # sysroot drops are mirrored.
        # - aarch64-rockchip-linux-gnu
    env:
      BINARY_DIR: extensions/vision-nav/vendor/${{ matrix.binary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential git \
            crossbuild-essential-arm64

      - name: Install sysroot dependencies
        # The current scaffold shims only need a C++ compiler + libpthread,
        # which crossbuild-essential-arm64 already supplies for the cross
        # case. We keep this step as a no-op stub so the matrix layout
        # stays stable for future revisions of the shim that adopt the
        # real OpenVINS / Ceres / VINS-Fusion estimators — at which point
        # the per-arch sysroot package list reappears here.
        run: |
          echo "scaffold build: no extra sysroot packages required"

      - name: Configure
        working-directory: ${{ env.BINARY_DIR }}
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=/usr/bin/aarch64-linux-gnu-gcc \
              -DCMAKE_CXX_COMPILER=/usr/bin/aarch64-linux-gnu-g++ \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        working-directory: ${{ env.BINARY_DIR }}
        run: cmake --build build -j$(nproc) --verbose

      - name: Conformance (x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: ${{ env.BINARY_DIR }}
        run: |
          binary_name="ados_$(echo ${{ matrix.binary }} | tr '-' '_')_shim"
          # Capture stderr so we can distinguish the intentional
          # "not yet implemented" scaffold exit from a real
          # crash. The grep check is the conformance gate until the
          # upstream integration lands and the binary returns 0.
          set +e
          ./build/${binary_name} --conformance 2> conformance.log
          status=$?
          set -e
          cat conformance.log
          if grep -q "not yet implemented" conformance.log; then
            echo "scaffold exit accepted"
            exit 0
          fi
          exit $status

      - name: Sign artefact
        working-directory: ${{ env.BINARY_DIR }}
        env:
          ADOS_SIGNING_KEY: ${{ secrets.ADOS_SIGNING_KEY }}
        run: |
          binary_name="ados_$(echo ${{ matrix.binary }} | tr '-' '_')_shim"
          out="build/${binary_name}-${{ matrix.target }}.tar.gz"
          tar -czf "$out" -C build "$binary_name"
          if [ -n "$ADOS_SIGNING_KEY" ]; then
            # The secret is base64-encoded PEM (so the main release
            # path's sign.sh works with ADOS_SIGNING_KEY_INLINE=1).
            # Decode before handing to cryptography.load_pem_private_key.
            echo "$ADOS_SIGNING_KEY" | base64 -d > /tmp/signing.key
            python3 -m pip install --quiet cryptography
            python3 - "$out" /tmp/signing.key <<'PY'
          import base64, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          payload = open(sys.argv[1], "rb").read()
          key = load_pem_private_key(open(sys.argv[2], "rb").read(), password=None)
          assert isinstance(key, Ed25519PrivateKey)
          sig = key.sign(payload)
          open(sys.argv[1] + ".sig", "wb").write(base64.b64encode(sig))
          PY
          else
            echo "ADOS_SIGNING_KEY not set; skipping signature"
          fi

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.target }}
          path: |
            ${{ env.BINARY_DIR }}/build/*.tar.gz
            ${{ env.BINARY_DIR }}/build/*.tar.gz.sig

  # NOTE: the on-tag release-upload path is owned by vision-nav-release.yml.
  # Manual rebuilds via workflow_dispatch only produce same-run artifacts
  # downloadable from the run page — they do not attach to any GitHub Release.
