# navigation-release
#
# Fires on a `navigation-v*` tag push. Navigation ships its binaries and the
# native helpers of its lidar-slam service as install-time payloads (manifest
# `agent.payloads`), not inside the .adosplug, so a node fetches only the files
# for its own arch and profile.
#
#   legs      list the binary legs (aarch64-linux, x86_64-linux).
#   binaries  one leg per arch: build `navigation` and `navigation-lidar-slam`
#             against the agent SDK pinned in ADOS_AGENT_REV, the KISS-ICP
#             runtime (pinned CPython plus the locked wheels, smoke-run on a
#             synthetic stream), the Livox SDK2 and librealsense2 libraries,
#             and on the x86_64-linux leg basalt-ados; hand them to the
#             release job.
#   release   build and test the GCS bundle, write each payload's source,
#             sha256 and size into the staged manifest, pack the small archive
#             (manifest, GCS bundle, locales, config-schema.json, the
#             lidar-slam KISS-ICP project), sign it with the first-party key, then
#             attach the payloads and the signed archive to the GitHub Release
#             in one step, so a published archive never points at a missing
#             payload.
#
# The asset table (names, archive paths, arch and profile gates) is
# scripts/navigation-payloads.tsv.

name: navigation-release

on:
  push:
    tags:
      - "navigation-v*"

permissions:
  contents: read

env:
  # The agent SDK crates are workspace path deps on a sibling ADOSDroneAgent
  # checkout, pinned by the committed ADOS_AGENT_REV so re-running a tag builds
  # against the same SDK commit.
  ADOS_AGENT_REPO: https://github.com/altnautica/ADOSDroneAgent
  # The oldest glibc navigation-lidar-slam and the Livox SDK2 library run on
  # (manylinux_2_28: Debian 10, Ubuntu 18.10 and newer).
  GLIBC_FLOOR: "2.28"
  # The manylinux_2_28 build images, pinned by digest so a re-run of a tag
  # builds the native libraries in the same image.
  MANYLINUX_x86_64: quay.io/pypa/manylinux_2_28_x86_64@sha256:55a36963bc0504cdf004011001c1072306402f0b8b83be5a5eba7068f93eec53
  MANYLINUX_aarch64: quay.io/pypa/manylinux_2_28_aarch64@sha256:126d9eea9d6b1717f3e17b2b3ac51da04ef159a5f935dac36fe92d621dc8f246

jobs:
  checks:
    uses: ./.github/workflows/extensions.yml
    with:
      ext: navigation

  legs:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.legs.outputs.matrix }}
    steps:
      - id: legs
        # `navigation` is a static musl binary, so it runs on every supported
        # board regardless of its glibc; the musl legs cross-compile C through
        # zig (cargo-zigbuild), as in rust-check.yml. `navigation-lidar-slam`
        # opens the Livox SDK2 library at run time, which a static musl
        # binary cannot (its dlopen is a stub), so it links glibc dynamically,
        # pinned through zig to the same glibc floor as the manylinux image
        # the Livox library builds in. basalt-ados builds on the x86_64-linux
        # leg only (native).
        run: |
          set -euo pipefail
          legs='[
            {"runner":"ubuntu-24.04-arm","arch_os":"aarch64-linux","target":"aarch64-unknown-linux-musl",
             "slam_target":"aarch64-unknown-linux-gnu","uv_triple":"aarch64-unknown-linux-musl"},
            {"runner":"ubuntu-24.04","arch_os":"x86_64-linux","target":"x86_64-unknown-linux-musl",
             "slam_target":"x86_64-unknown-linux-gnu","uv_triple":"x86_64-unknown-linux-musl","native":true}
          ]'
          matrix="$(jq -c '{include: .}' <<<"${legs}")"
          echo "${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  binaries:
    needs: [checks, legs]
    name: Binaries (${{ matrix.arch_os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.legs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out the agent SDK at the pinned revision
        run: |
          set -euo pipefail
          dest="${GITHUB_WORKSPACE}/../ADOSDroneAgent"
          git clone --filter=blob:none "${ADOS_AGENT_REPO}" "${dest}"
          git -C "${dest}" checkout "$(cat ADOS_AGENT_REV)"
          echo "agent SDK pinned at ADOSDroneAgent@$(git -C "${dest}" rev-parse --short HEAD)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }},${{ matrix.slam_target }}

      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-zigbuild

      - name: Cache the cargo registry
        # Downloaded sources only: a release never starts from a cached
        # `target/` another run could have written.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: navigation-release-${{ matrix.arch_os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: navigation-release-${{ matrix.arch_os }}-

      - name: Build release binaries
        env:
          TARGET: ${{ matrix.target }}
          SLAM_TARGET: ${{ matrix.slam_target }}
        run: |
          set -euo pipefail
          cargo zigbuild --release --target "${TARGET}" -p navigation
          cargo zigbuild --release --target "${SLAM_TARGET}.${GLIBC_FLOOR}" -p navigation-lidar-slam

      - name: Stage payloads
        env:
          TARGET: ${{ matrix.target }}
          SLAM_TARGET: ${{ matrix.slam_target }}
          ARCH_OS: ${{ matrix.arch_os }}
        run: |
          set -euo pipefail
          mkdir -p payloads
          cp "target/${TARGET}/release/navigation" "payloads/navigation-${ARCH_OS}"
          cp "target/${SLAM_TARGET}/release/navigation-lidar-slam" "payloads/navigation-lidar-slam-${ARCH_OS}"
          for crate in navigation navigation-lidar-slam; do
            ls -l "payloads/${crate}-${ARCH_OS}"
            file "payloads/${crate}-${ARCH_OS}"
          done
          # A static lidar-slam would fail to open the Livox SDK2 library.
          file "payloads/navigation-lidar-slam-${ARCH_OS}" | grep -q 'dynamically linked' || {
            echo "ERROR: navigation-lidar-slam must link glibc dynamically to load the Livox SDK2" >&2
            exit 1
          }

      - name: Build the Livox SDK2 library
        # Inside the manylinux_2_28 image of the leg's arch (native on both
        # runners), so the library needs nothing newer than glibc 2.28.
        env:
          ARCH_OS: ${{ matrix.arch_os }}
        run: |
          set -euo pipefail
          arch="${ARCH_OS%-linux}"
          image_var="MANYLINUX_${arch}"
          out="${RUNNER_TEMP}/livox"
          mkdir -p "${out}"
          docker run --rm -v "${GITHUB_WORKSPACE}:/src:ro" -v "${out}:/out" \
            "${!image_var}" \
            bash /src/extensions/navigation/lidar-slam/livox/build-sdk2.sh --arch "${arch}" --jobs 4 --out /out
          sudo chown -R "$(id -u):$(id -g)" "${out}"
          lib="${out}/lib/${ARCH_OS}/liblivox_lidar_sdk_shared.so"
          need="$(objdump -T "${lib}" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n1)"
          echo "Livox SDK2 (${ARCH_OS}) needs glibc ${need}"
          if [ "$(printf '%s\n%s\n' "${need}" "${GLIBC_FLOOR}" | sort -V | tail -n1)" != "${GLIBC_FLOOR}" ]; then
            echo "ERROR: the Livox SDK2 library needs glibc ${need}, above the ${GLIBC_FLOOR} floor" >&2
            exit 1
          fi
          cp "${lib}" "payloads/navigation-livox-sdk2-${ARCH_OS}.so"
          cp "${out}/lib/${ARCH_OS}/LICENSE-livox-sdk2.txt" "payloads/navigation-livox-sdk2-LICENSE-${ARCH_OS}"
          file "payloads/navigation-livox-sdk2-${ARCH_OS}.so"

      - name: Build the librealsense2 library
        # Inside the manylinux_2_28 image of the leg's arch, so the library
        # needs nothing newer than glibc 2.28; it links the board's libusb-1.0.
        env:
          ARCH_OS: ${{ matrix.arch_os }}
        run: |
          set -euo pipefail
          arch="${ARCH_OS%-linux}"
          image_var="MANYLINUX_${arch}"
          out="${RUNNER_TEMP}/librealsense2"
          mkdir -p "${out}"
          docker run --rm -v "${GITHUB_WORKSPACE}:/src:ro" -v "${out}:/out" \
            "${!image_var}" \
            bash /src/extensions/navigation/lidar-slam/realsense/build-librealsense2.sh --arch "${arch}" --jobs 4 --out /out
          sudo chown -R "$(id -u):$(id -g)" "${out}"
          lib="${out}/lib/${ARCH_OS}/librealsense2.so"
          need="$(objdump -T "${lib}" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n1)"
          echo "librealsense2 (${ARCH_OS}) needs glibc ${need}"
          if [ "$(printf '%s\n%s\n' "${need}" "${GLIBC_FLOOR}" | sort -V | tail -n1)" != "${GLIBC_FLOOR}" ]; then
            echo "ERROR: librealsense2 needs glibc ${need}, above the ${GLIBC_FLOOR} floor" >&2
            exit 1
          fi
          cp "${lib}" "payloads/navigation-librealsense2-${ARCH_OS}.so"
          cp "${out}/lib/${ARCH_OS}/LICENSE-librealsense2.txt" "payloads/navigation-librealsense2-LICENSE-${ARCH_OS}"
          file "payloads/navigation-librealsense2-${ARCH_OS}.so"

      - name: Build basalt-ados
        if: matrix.native
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl zip unzip tar pkg-config ninja-build
          git submodule update --init extensions/navigation/lidar-slam/basalt/upstream
          L=extensions/navigation/lidar-slam
          out="${RUNNER_TEMP}/native"
          "$L/basalt/build.sh" --arch x86_64 --jobs 4 --out "$out"
          cp "$out/bin/x86_64-linux/basalt-ados" payloads/navigation-basalt-ados-x86_64-linux
          {
            cat "$L/basalt/LICENSE"
            printf '\n\n==== Basalt (upstream) ====\n\n'; cat "$L/basalt/upstream/LICENSE"
            for f in "$L"/basalt/build/x86_64/vcpkg_installed/*/share/*/copyright; do
              printf '\n\n==== %s ====\n\n' "$(basename "$(dirname "$f")")"; cat "$f"
            done
          } > payloads/navigation-basalt-ados-LICENSES-x86_64-linux
          file payloads/navigation-basalt-ados-x86_64-linux

      - name: Build the KISS-ICP runtime
        # The pinned uv (checksum-verified) resolves the project's uv.lock to
        # binary manylinux_2_28 wheels; the build pins CPython by sha256 and
        # checks every ELF file against the glibc floor. The smoke run plays a
        # synthetic 3D LiDAR stream through the runtime natively, so each
        # arch's runtime is proven to run before it ships.
        env:
          UV_TRIPLE: ${{ matrix.uv_triple }}
          ARCH_OS: ${{ matrix.arch_os }}
        run: |
          set -euo pipefail
          v=0.13.1
          case "$UV_TRIPLE" in
            x86_64-unknown-linux-musl)  sum=6c86040a8f045ab9adc9e3ec4cdafa03fd00e9a988ed2bf28971c7fc2d0debd0 ;;
            aarch64-unknown-linux-musl) sum=345a8308e4d1835cdfaadf692836fd3137a6d45864773f05ad7bf59442b1ba16 ;;
          esac
          tgz="uv-${UV_TRIPLE}.tar.gz"
          curl -fsSLo "${RUNNER_TEMP}/${tgz}" "https://github.com/astral-sh/uv/releases/download/${v}/${tgz}"
          echo "${sum}  ${RUNNER_TEMP}/${tgz}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tgz}" -C "${RUNNER_TEMP}"
          L=extensions/navigation/lidar-slam
          out="${RUNNER_TEMP}/kiss-runtime"
          bash "$L/kiss-runtime/build-runtime.sh" --arch "${ARCH_OS%-linux}" --out "$out" \
            --uv "${RUNNER_TEMP}/uv-${UV_TRIPLE}/uv"
          python3 "$L/kiss-runtime/stream_check.py" --python "$out/kiss-icp-runtime-${ARCH_OS}/bin/python3" \
            --project "$L/python/kiss_icp_live" --seconds 5
          cp "$out/kiss-icp-runtime-${ARCH_OS}.zip" "payloads/navigation-kiss-icp-runtime-${ARCH_OS}.zip"

      - name: Hand the binaries to the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: payload-${{ matrix.arch_os }}
          path: payloads/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [legs, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      EXT_DIR: extensions/navigation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check the tag matches the manifest version
        run: |
          set -euo pipefail
          # Tag form: navigation-v<semver>. The payload URLs name the tag and
          # the archive names the manifest version, so the two must agree.
          tag_version="${GITHUB_REF_NAME##*-v}"
          manifest_version="$(grep -E '^version:' "${EXT_DIR}/manifest.yaml" | head -n1 | sed -E 's/^version:[[:space:]]*"?([^"]*)"?/\1/')"
          if [ "${tag_version}" != "${manifest_version}" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match manifest version ${manifest_version}" >&2
            exit 1
          fi
          archive="${EXT_DIR}/dist/com.altnautica.navigation-${manifest_version}.adosplug"
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"
          echo "SIGNED=${archive%.adosplug}.signed.adosplug" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pip install cryptography

      - name: Build the GCS bundle
        run: pnpm build:navigation

      - name: Collect the binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: payload-*
          path: payloads
          merge-multiple: true

      - name: Write the payload list
        env:
          LEGS: ${{ needs.legs.outputs.matrix }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          built="$(jq -r '[.include[].arch_os] | join(",")' <<<"${LEGS}")"
          echo "ARCH_OS=${built}" >> "$GITHUB_ENV"
          awk -v base="${base}" -v built=",${built}," '
            /^[[:space:]]*(#|$)/ { next }
            $3 != "-" && index(built, "," $3 ",") == 0 { next }
            { printf "%s\t%s\t%s\t%s\t%s/%s\n", $1, $2, $3, $4, base, $1 }
          ' scripts/navigation-payloads.tsv > payloads/payloads.tsv
          cat payloads/payloads.tsv

      - name: Pack archive
        # Refuses to pack when a binaries path lacks a payload row or a listed
        # asset is missing.
        run: ./scripts/pack-rust.sh navigation --payload-manifest payloads/payloads.tsv --arch-os "${ARCH_OS}"

      - name: Sign archive
        env:
          # Same first-party key as release.yml so a single public half
          # (/etc/ados/plugin-keys/altnautica-2026-A.pem) verifies every plugin.
          ADOS_SIGNING_KEY: ${{ secrets.ALTNAUTICA_PLUGIN_KEY_A }}
          ADOS_SIGNING_KEY_INLINE: "1"
          ADOS_SIGNING_KEY_ID: altnautica-2026-A
        run: ./scripts/sign.sh "${ARCHIVE}"

      - name: Verify the signature against the committed public key
        run: |
          set -euo pipefail
          # Recompute the canonical payload hash from the signed archive (sha256
          # over the sorted "<path>\n<sha256-hex>\n" of every entry except
          # SIGNATURE, the agent's archive rule) and verify SIGNATURE line 2
          # against keys/<signer>.pub.pem.
          python3 - "${SIGNED}" <<'PY'
          import base64
          import hashlib
          import sys
          import zipfile
          from pathlib import Path

          from cryptography.exceptions import InvalidSignature
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          from cryptography.hazmat.primitives.serialization import load_pem_public_key

          with zipfile.ZipFile(sys.argv[1]) as z:
              lines = z.read("SIGNATURE").decode("ascii").splitlines()
              entries = sorted(
                  (i.filename, z.read(i))
                  for i in z.infolist()
                  if not i.is_dir() and i.filename != "SIGNATURE"
              )
          signer, sig_b64 = lines[0].strip(), lines[1].strip()
          pem = Path("keys") / f"{signer}.pub.pem"
          if not pem.is_file():
              sys.exit(f"ERROR: signer '{signer}' has no committed public key at {pem}")
          key = load_pem_public_key(pem.read_bytes())
          if not isinstance(key, Ed25519PublicKey):
              sys.exit(f"ERROR: {pem} is not an Ed25519 public key")
          agg = hashlib.sha256()
          for name, data in entries:
              agg.update(f"{name}\n{hashlib.sha256(data).hexdigest()}\n".encode())
          try:
              key.verify(base64.b64decode(sig_b64), agg.digest())
          except InvalidSignature:
              sys.exit(f"ERROR: the signature does not verify against {pem}")
          print(f"OK: signature by {signer} verifies against {pem}")
          PY

      - name: Emit SHA-256 checksum
        run: |
          digest=$(shasum -a 256 "${SIGNED}" | awk '{print $1}')
          printf '%s  %s\n' "${digest}" "$(basename "${SIGNED}")" > "${SIGNED}.sha256"
          cat "${SIGNED}.sha256"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          files: |
            payloads/navigation-*
            ${{ env.SIGNED }}
            ${{ env.SIGNED }}.sha256
            extensions/navigation/CHANGELOG.md
