name: release

on:
  push:
    tags:
      # One tag pattern per publishable extension. An extension is listed here
      # only when the capability it advertises can execute; adding a pattern is
      # what makes an archive publishable.
      #
      # thermal-camera-flir-lepton-usb is deliberately absent: its capture path
      # needs a libuvc backend that does not exist in this tree, so no
      # configuration of it can produce a reading. It builds and tests as a
      # development preview; it is not published.
      #
      # vision-nav-v* and world-engine-v* publish through their own workflows
      # (vision-nav-release.yml, world-engine-release.yml), whose tag triggers
      # are their allowlist entries. Listing them here as well would publish
      # a second, pack.sh-built archive for the same tag.
      - "mavlink-gimbal-v2-v*"
      - "follow-me-v*"
      - "siyi-pod-v*"

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      ext: ${{ steps.route.outputs.ext }}
    steps:
      - name: Pick the extension from the tag
        id: route
        run: |
          # Tag form: <ext>-v<semver>
          echo "ext=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_OUTPUT"

  checks:
    needs: route
    uses: ./.github/workflows/extensions.yml
    with:
      ext: ${{ needs.route.outputs.ext }}

  build-and-release:
    needs: [route, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXT: ${{ needs.route.outputs.ext }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches the manifest version
        run: |
          set -euo pipefail
          # Tag form: <ext>-v<semver>. The archive names the manifest version,
          # so a tag that disagrees would publish a mis-versioned release.
          tag_version="${GITHUB_REF_NAME##*-v}"
          manifest_version="$(grep -E '^version:' "extensions/${EXT}/manifest.yaml" | head -n1 | sed -E 's/^version:[[:space:]]*"?([^"]*)"?/\1/')"
          if [ "${tag_version}" != "${manifest_version}" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match manifest version ${manifest_version}" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pip install cryptography

      - name: Build workspace SDK
        run: pnpm --filter @altnautica/plugin-sdk build

      - name: Pack archive
        run: ./scripts/pack.sh "${EXT}"

      - name: Sign archive
        env:
          # The same first-party key as the other release workflows; its public
          # half is committed at keys/altnautica-2026-A.pub.pem.
          ADOS_SIGNING_KEY: ${{ secrets.ALTNAUTICA_PLUGIN_KEY_A }}
          ADOS_SIGNING_KEY_INLINE: "1"
          ADOS_SIGNING_KEY_ID: altnautica-2026-A
        run: |
          archive="extensions/${EXT}/dist/$(ls "extensions/${EXT}/dist" | grep -E '\.adosplug$' | grep -v '\.signed\.' | head -n1)"
          ./scripts/sign.sh "${archive}"
          echo "SIGNED=${archive%.adosplug}.signed.adosplug" >> "$GITHUB_ENV"

      - name: Verify the signature against the committed public key
        run: |
          set -euo pipefail
          # Recompute the canonical payload hash from the signed archive (sha256
          # over the sorted "<path>\n<sha256-hex>\n" of every entry except
          # SIGNATURE, the agent's archive rule) and verify SIGNATURE line 2
          # against keys/<signer>.pub.pem. A wrong key id, a mismatched private
          # key or a tampered entry fails here instead of at install.
          python3 - "${SIGNED}" <<'PY'
          import base64
          import hashlib
          import sys
          import zipfile
          from pathlib import Path

          from cryptography.exceptions import InvalidSignature
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          from cryptography.hazmat.primitives.serialization import load_pem_public_key

          with zipfile.ZipFile(sys.argv[1]) as z:
              lines = z.read("SIGNATURE").decode("ascii").splitlines()
              entries = sorted(
                  (i.filename, z.read(i))
                  for i in z.infolist()
                  if not i.is_dir() and i.filename != "SIGNATURE"
              )
          signer, sig_b64 = lines[0].strip(), lines[1].strip()
          pem = Path("keys") / f"{signer}.pub.pem"
          if not pem.is_file():
              sys.exit(f"ERROR: signer '{signer}' has no committed public key at {pem}")
          key = load_pem_public_key(pem.read_bytes())
          if not isinstance(key, Ed25519PublicKey):
              sys.exit(f"ERROR: {pem} is not an Ed25519 public key")
          agg = hashlib.sha256()
          for name, data in entries:
              agg.update(f"{name}\n{hashlib.sha256(data).hexdigest()}\n".encode())
          try:
              key.verify(base64.b64decode(sig_b64), agg.digest())
          except InvalidSignature:
              sys.exit(f"ERROR: the signature does not verify against {pem}")
          print(f"OK: signature by {signer} verifies against {pem}")
          PY

      - name: Emit SHA-256 checksum
        run: |
          # The agent's first-party catalog requires an archive_sha256
          # pin to gate install_from_url. Emit the digest alongside the
          # signed archive in shasum-compatible format so the catalog
          # client can verify ``shasum -a 256 -c`` on download.
          digest=$(shasum -a 256 "${SIGNED}" | awk '{print $1}')
          printf '%s  %s\n' "${digest}" "$(basename "${SIGNED}")" > "${SIGNED}.sha256"
          cat "${SIGNED}.sha256"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ env.SIGNED }}
            ${{ env.SIGNED }}.sha256
            extensions/${{ env.EXT }}/CHANGELOG.md
