name: release

on:
  push:
    tags:
      - "battery-health-panel-v*"
      - "thermal-camera-flir-lepton-usb-v*"
      - "mavlink-gimbal-v2-v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the extension from the tag
        id: route
        run: |
          tag="${GITHUB_REF_NAME}"
          # Tag form: <ext>-v<semver>
          ext="${tag%-v*}"
          version="${tag##*-v}"
          echo "ext=${ext}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile=false
          pip install cryptography

      - name: Build workspace SDK
        run: pnpm --filter @altnautica/plugin-sdk build

      - name: Run extension tests
        run: pnpm --filter "./extensions/${{ steps.route.outputs.ext }}/gcs" test

      - name: Pack archive
        run: ./scripts/pack.sh "${{ steps.route.outputs.ext }}"

      - name: Sign archive
        env:
          ADOS_SIGNING_KEY: ${{ secrets.ADOS_SIGNING_KEY }}
          ADOS_SIGNING_KEY_INLINE: "1"
          ADOS_SIGNING_KEY_ID: ${{ secrets.ADOS_SIGNING_KEY_ID }}
        run: |
          archive="extensions/${{ steps.route.outputs.ext }}/dist/$(ls extensions/${{ steps.route.outputs.ext }}/dist | head -n1)"
          ./scripts/sign.sh "${archive}"

      - name: Assert signer id is first-party
        run: |
          # Defensive guard against a misconfigured ADOS_SIGNING_KEY_ID
          # secret producing a placeholder signer (the agent rejects
          # the install with signature_unknown_signer at runtime, but
          # we'd rather fail the workflow than ship a broken archive
          # to the catalog). Allowlist mirrors FIRST_PARTY_SIGNERS in
          # the agent at src/ados/plugins/signing.py.
          signed="extensions/${{ steps.route.outputs.ext }}/dist/$(ls extensions/${{ steps.route.outputs.ext }}/dist | grep -E '\.signed\.adosplug$' | head -n1)"
          signer=$(unzip -p "${signed}" SIGNATURE | head -n1)
          case "${signer}" in
            altnautica-2026-A|altnautica-2026-B)
              echo "OK: signer ${signer}"
              ;;
            *)
              echo "ERROR: signer '${signer}' is not in the first-party allowlist" >&2
              echo "ERROR: set ADOS_SIGNING_KEY_ID secret to altnautica-2026-A or -B" >&2
              exit 1
              ;;
          esac

      - name: Emit SHA-256 checksum
        run: |
          # The agent's first-party catalog requires an archive_sha256
          # pin to gate install_from_url. Emit the digest alongside the
          # signed archive in shasum-compatible format so the catalog
          # client can verify ``shasum -a 256 -c`` on download.
          signed="extensions/${{ steps.route.outputs.ext }}/dist/$(ls extensions/${{ steps.route.outputs.ext }}/dist | grep -E '\.signed\.adosplug$' | head -n1)"
          digest=$(shasum -a 256 "${signed}" | awk '{print $1}')
          printf '%s  %s\n' "${digest}" "$(basename "${signed}")" > "${signed}.sha256"
          cat "${signed}.sha256"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extensions/${{ steps.route.outputs.ext }}/dist/*.signed.adosplug
            extensions/${{ steps.route.outputs.ext }}/dist/*.signed.adosplug.sha256
            extensions/${{ steps.route.outputs.ext }}/CHANGELOG.md
