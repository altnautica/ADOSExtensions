# Capture service (drone, Visor): reads engine frames, the flight controller
# pose and Navigation's pose and scans through the plugin host, records
# sessions, selects pose-tagged keyframes, and publishes the keyframe and
# capture-state streams on the extension's private bus for the link to
# forward.
[package]
name = "capture-service"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Capture service: session recording and pose-tagged keyframe selection, one camera up to an all-sides rig."

[lib]
name = "capture_service"
path = "src/lib.rs"

# Declared as the `capture` service in manifest.yaml
# (`bin:capture-service com.altnautica.capture`).
[[bin]]
name = "capture-service"
path = "src/main.rs"

[dependencies]
ados-mapping-protocol = { workspace = true }
ados-mapping-pose = { workspace = true }
ados-capture-contract = { workspace = true }
ados-sdk = { workspace = true }
# The vision framebus value types and the Unix-socket framing the private
# bus and the control socket speak.
ados-protocol = { workspace = true }
# The sensor bus client (seam J) and the capture storage admission rule.
ados-sensorbus = { workspace = true }
ados-config = { workspace = true }
prost = "0.14"
prost-types = "0.14"
# Kalibr calibration YAML import.
serde_yaml_ng = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
# CLOCK_MONOTONIC, the host_monotonic timebase keyframes are stamped on.
nix = { version = "0.29", default-features = false, features = ["time"] }
# Encode a selected keyframe's raw frame to JPEG before it ships to the compute
# node (a reconstructor ingests compressed images, never raw planes).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# The session's planar scans as a zstd (level 3) polar stream.
zstd = "0.13"

[dev-dependencies]
ados-mapping-pose = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
