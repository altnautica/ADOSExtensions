# Capture link: the extension's main process on every profile. On a drone or
# Visor it forwards keyframes over the bearer ladder, publishes the shared
# capture state and the `status` telemetry, uploads sessions, and serves the
# capture API on the plugin's HTTP socket. On a ground station it relays the
# radio aux lane onto the LAN.
[package]
name = "capture-link"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Capture link: keyframe forwarder, session uploader, ground-station relay, and the capture API."

[lib]
name = "capture_link"
path = "src/lib.rs"

# The manifest entrypoint (`agent.entrypoint: bin:capture-link`).
[[bin]]
name = "capture-link"
path = "src/main.rs"

[dependencies]
ados-mapping-protocol = { workspace = true }
ados-mapping-transport = { workspace = true }
capture-service = { path = "../capture" }
ados-capture-contract = { workspace = true }
ados-sdk = { workspace = true }
# Node-credential store, the capture-bus framing, the aux channel ids, the
# cloud-publish limits, and the vision detection-bus types.
ados-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmpv = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
axum = { workspace = true }
socket2 = { workspace = true }

[dev-dependencies]
ados-mapping-transport = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
