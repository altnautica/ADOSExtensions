# Vision Navigation agent half, in Rust.
#
# The hot path (frame consumption, optical-flow tracking, the mode
# degradation FSM, the scale ladder, the pre-arm gate, the MAVLink
# component router, TIMESYNC clock alignment, IMU sourcing, rangefinder
# drivers, and the heartbeat snapshot) is Rust. The one-time offline
# camera-IMU calibration wizard stays Python (calibration-helper/), out
# of the hot path; this crate only reads the camchain.yaml it produces.
[package]
name = "vision-nav"
version = "0.4.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GPS-denied navigation: optical flow from a downward camera, feeding angular flow and range into the autopilot EKF over MAVLink. Supports ArduPilot, PX4, and iNav 7.0+ on USB UVC or CSI cameras."

# The compiled binary is the manifest entrypoint. The plugin host execs
# it directly under systemd and hands it the per-plugin socket; the
# binary name is referenced from manifest.yaml as
# agent.entrypoint: bin/vision-nav.
[[bin]]
name = "vision-nav"
path = "src/main.rs"

[lib]
name = "vision_nav"
path = "src/lib.rs"

[dependencies]
# The SDK brings the IPC client, the plugin-facing context facade, the
# lifecycle runner, the vision client (ctx.vision frames), and the
# testing harness.
ados-sdk = { workspace = true }
# The vision framebus value types (Frame ergonomics come from the SDK;
# FrameFormat / FrameDescriptor come from here) plus the ardupilotmega
# MAVLink codec (OPTICAL_FLOW_RAD, DISTANCE_SENSOR, RAW_IMU, TIMESYNC,
# HEARTBEAT) behind the `mavlink` feature.
ados-protocol = { workspace = true, features = ["mavlink"] }
tokio = { workspace = true }
rmpv = { workspace = true }
async-trait = { workspace = true }
serde = { version = "1", features = ["derive"] }
# camchain.yaml parsing for the camera-IMU timeshift the frame/IMU
# aligner consumes (Kalibr cam0 block).
serde_yaml = "0.9"

[dev-dependencies]
ados-sdk = { workspace = true }
