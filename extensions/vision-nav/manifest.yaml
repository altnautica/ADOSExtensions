schema_version: 2
id: com.altnautica.vision-nav
name: "ADOS Vision Navigation"
version: "0.2.4"
description: "GPS-denied navigation. Optical flow (downward camera) and visual-inertial odometry (forward or downward camera). Supports ArduPilot, PX4, and iNav 7.0+ on USB UVC or CSI cameras."
description_long: |
  ADOS Vision Navigation gives the flight controller a position estimate when GPS is unavailable or unreliable. The plugin runs on the drone's companion computer and emits MAVLink optical-flow or visual-inertial-odometry components to the FC, letting the operator hold position indoors, under tree cover, in urban canyons, or in any other GPS-degraded environment. The estimate is fused inside the FC's existing EKF lanes so the rest of the flight stack (altitude hold, position hold, loiter, return-to-launch) keeps working without code changes on the FC side.

  Six operating modes pick how the navigation estimate is produced and how it fails over.

  Optical Flow + rangefinder. Fastest startup, lowest CPU. A downward-facing camera measures pixel motion and reads height from a connected rangefinder (TF-Luna, Garmin LIDAR-Lite, ST VL53L1X). Best for indoor hover and low-altitude flight up to roughly 8 m AGL.

  Optical Flow rangefinder-free. Same Lucas-Kanade tracker, height estimated from the barometer. Tolerates rangefinder failure but drifts more aggressively above 5 m AGL because the barometer is noisier than a laser at low altitude.

  OpenVINS VIO. MSCKF-based monocular visual-inertial odometry from the Robot Perception and Navigation Group at the University of Delaware. Tight IMU sync, fast feature tracker, no loop closure. Best for outdoor flight with a forward camera and good lighting; pairs well with a global-shutter USB UVC camera.

  VINS-Fusion VIO. Optimization-based monocular VIO from the HKUST Aerial Robotics Group. Sliding-window bundle adjustment with loop closure. Slower to initialize than OpenVINS but more accurate over long trajectories and more robust to brief feature dropouts.

  Hybrid (OF + VIO). Runs optical flow on the downward camera and one of the two VIO backends on the forward camera simultaneously. Cross-checks both estimates, demotes whichever drifts faster, and reports the fused result to the FC. The highest-cost mode but the most resilient against sensor disagreement.

  Off. No vision navigation; the FC falls back to GPS-only EKF lanes. Use this when you want the plugin installed for future flights but disabled for the current mission.

  Degradation ladder. If the active estimator falls below the configured feature-count threshold or its drift exceeds the configured ceiling, the plugin automatically steps down: VIO → optical flow → barometer-only hover-hold → land. The FC keeps flying through each transition; every step is announced over MAVLink as a STATUSTEXT so the GCS can warn the operator and the flight log captures the event.

  Firmware support. ArduPilot Copter/Plane/Rover 4.5+, PX4 1.14+, and iNav 7.0+. The plugin auto-detects the FC firmware on boot, then emits OPTICAL_FLOW_RAD on MAVLink component 198 (peripheral) and VISION_POSITION_ESTIMATE on component 197 (VIO) only when a VIO mode is active. EKF source bits are tuned per firmware so the FC accepts the vision estimate as a primary position source.

  Hardware. USB UVC global-shutter cameras are preferred for VIO. Rolling-shutter and CSI-V4L2 cameras work for optical-flow modes. VIO modes additionally need a Kalibr-compatible IMU-camera calibration file at /etc/ados/vision-nav/calib/. The bundled vendor binaries (OpenVINS and VINS-Fusion shims) ship signed alongside the rest of the archive and run as subprocesses under the agent's sandbox; the optical-flow paths are pure Python and need no vendor code.

  Calibration. Calibrate once with the bundled wizard (Settings → Vision Nav → Calibrate) and the result is stored per drone. The wizard walks through camera intrinsics, IMU-camera time offset, and IMU-camera transform extraction and produces the Kalibr-compatible YAML the VIO backends consume. The whole flow takes about ten minutes on a calibration target the GCS displays on screen.
features:
  - "Optical flow with or without rangefinder (Lucas-Kanade tracker)"
  - "Monocular VIO via OpenVINS or VINS-Fusion"
  - "Hybrid mode: optical flow and VIO running side by side"
  - "Auto-detect ArduPilot, PX4, or iNav and emit appropriate MAVLink"
  - "Per-mode pre-arm checks with degradation fallback ladder"
  - "Live telemetry: feature count, drift, sync offset, mode state"
hardware_requirements:
  cameras: "USB UVC global-shutter or rolling-shutter, or CSI via V4L2"
  fc_firmware: "ArduPilot 4.5+, PX4 1.14+, iNav 7.0+"
  boards: ["cm4", "cm5", "rk3582", "rk3588s2", "rk3576", "rpi5", "pi-zero-2w"]
  optional:
    - "Rangefinder (TF-Luna, Garmin LIDAR-Lite, ST VL53L1X) for optical flow modes"
resource_impact:
  cpu_percent_peak: 80
  ram_mb: 512
  pids: 24
  startup_time_seconds: 5
required_fc_parameters:
  ardupilot:
    - param: "EKF_SOURCE_SET"
      note: "Select vision pose source for the active EKF lane"
  px4:
    - param: "EKF2_AID_MASK"
      note: "Set VISION_POS and VISION_HEADING bits"
  inav:
    - param: "opflow_hardware"
      value: "MAVLINK"
    - param: "nav_use_optflow_for_poshold"
      value: "ON"
telemetry_fields:
  - "navigation.rangefinder_type"
  - "navigation.estimator_state"
  - "navigation.feature_count"
  - "navigation.drift_m"
  - "navigation.sync_offset_ms"
  - "navigation.mode"
documentation_url: "https://docs.altnautica.com/drone-agent/vision-nav-overview"
author: "Altnautica"
homepage: "https://github.com/altnautica/ADOSExtensions/tree/main/extensions/vision-nav"
license: "GPL-3.0-or-later"
risk: high

compatibility:
  ados_version: ">=0.13.0"
  gcs_version: ">=0.12.0"
  supported_boards: ["cm4", "cm5", "rk3582", "rk3588s2", "rk3576", "rpi5", "pi-zero-2w"]

agent:
  entrypoint: "altnautica_vision_nav.plugin:VisionNavPlugin"
  isolation: subprocess
  per_drone_config: true
  # The VIO modes spawn a vendor binary; the optical-flow modes do not.
  # contains_vendor_binary is true so the installer surfaces the
  # vendor-attribution block at install time. When VIO modes are not
  # selected the binary stays on disk but never executes.
  contains_vendor_binary: true
  vendor_attribution:
    - name: "OpenVINS"
      license: "GPL-3.0-only"
      source_url: "https://github.com/rpng/open_vins"
      upstream_version: "v2.7"
      notice: "VIO mode vio_openvins uses the OpenVINS estimator from the Robot Perception and Navigation Group at the University of Delaware."
    - name: "VINS-Fusion"
      license: "GPL-3.0-only"
      source_url: "https://github.com/HKUST-Aerial-Robotics/VINS-Fusion"
      upstream_version: "be55a937a57436548ddfb1bd324bc1e9a9e828e0"
      notice: "VIO mode vio_vins_fusion uses the VINS-Fusion estimator from the HKUST Aerial Robotics Group."
  permissions:
    - id: hardware.usb.uvc
    - id: hardware.camera.csi
    - id: hardware.uart
    - id: hardware.i2c
    - id: sensor.camera.register
    - id: sensor.depth.register
    - id: telemetry.extend
    - id: event.publish
    - id: event.subscribe
    - id: mavlink.read
    - id: mavlink.write
    - id: mavlink.component.peripheral
    - id: mavlink.component.vio
    - id: estimator.pose.inject
    - id: process.spawn
  # Vendor-binary allowlist. The plugin host's subprocess sandbox
  # rejects any spawn whose basename is not in this list. Both
  # binaries live under ``<install_dir>/vendor/`` and are signed
  # together with the rest of the .adosplug archive.
  subprocess_spawn:
    - ados_openvins_shim
    - ados_vins_fusion_shim
  resources:
    max_ram_mb: 512
    max_cpu_percent: 80
    max_pids: 24
  mavlink_components:
    - component_id: 198
      component_kind: peripheral
      sub_id: 1
    # MAV_COMP_ID_VISUAL_INERTIAL_ODOMETRY for VIO emissions. The
    # router claims this component only when a vio_* mode is active;
    # heartbeat and component-info remain quiet in OF-only modes.
    - component_id: 197
      component_kind: vio
      sub_id: 1

gcs:
  entrypoint: "gcs/plugin.bundle.js"
  isolation: iframe
  permissions:
    - id: ui.slot.drone-detail-tab
    - id: ui.slot.video-overlay
    - id: ui.slot.notification-channel
    - id: telemetry.subscribe
    - id: command.send
  contributes:
    panels:
      - id: vision-nav-tab
        slot: drone.detail.tab
        title: "Vision Nav"
        icon: "compass"
        order: 60
    notifications:
      - id: vision-nav-degraded
        title: "Vision navigation degraded"
        severity: warning
  locales:
    - en
