schema_version: 1
id: com.altnautica.mavlink-gimbal-v2
name: "ADOS MAVLink Gimbal v2 Controller"
version: "1.1.1"
description: "MAVLink Gimbal v2 control with optional SimpleBGC, Storm32 NT, and Gremsy driver paths. Manual sliders, ROI lock-on-target, and an 'Aim at this target' action that keeps the gimbal on a vision-locked detection."
author: "Altnautica"
homepage: "https://github.com/altnautica/ADOSExtensions/tree/main/extensions/mavlink-gimbal-v2"
license: "GPL-3.0-or-later"
risk: medium

compatibility:
  ados_version: ">=0.99.125"
  gcs_version: ">=0.56.0"
  supported_boards: ["*"]

agent:
  entrypoint: "altnautica_gimbal_v2.plugin:GimbalV2Plugin"
  isolation: subprocess
  permissions:
    - id: hardware.uart
    - id: mavlink.read
    - id: mavlink.write
    - id: mavlink.component.gimbal
    - id: vision.detection.subscribe
    - id: event.publish
    - id: event.subscribe
    - id: telemetry.extend
  resources:
    max_ram_mb: 64
    max_cpu_percent: 15
    max_pids: 8
  mavlink_components:
    - component_id: 154
      component_kind: gimbal
      sub_id: 0

gcs:
  entrypoint: "gcs/plugin.bundle.js"
  isolation: iframe
  permissions:
    - id: ui.slot.fc-tab
    - id: ui.slot.video-overlay
    - id: ui.slot.notification-channel
    - id: ui.slot.settings-section
    - id: telemetry.subscribe.gimbal
    - id: telemetry.subscribe.mavlink
    - id: mission.read
    - id: mission.write
    - id: command.send
  contributes:
    panels:
      - id: gimbal-control
        slot: fc.tab
        title: "Gimbal"
        icon: "gimbal"
        order: 60
      - id: gimbal-reticle
        slot: video.overlay
        title: "Gimbal reticle"
        icon: "crosshair"
    notifications:
      - id: gimbal-health
        title: "Gimbal health"
        severity: warning
    # A cockpit target action: click a detected object in the host overlay,
    # pick "Aim at this target", and the gimbal keeps it centred. The host
    # owns the overlay, the box drawing, the selection, and the designate +
    # config write -- this plugin only declares the action. No
    # applies_to_class: a gimbal can aim at any detected object.
    target_actions:
      - id: aim
        label: "Aim at this target"
        icon: crosshair
        order: 30
        designate: true
        config_key: aim
        config_value: true
        default_key: "g"
  locales:
    - en
