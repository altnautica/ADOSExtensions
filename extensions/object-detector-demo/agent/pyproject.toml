[project]
name = "altnautica-object-detector-demo"
version = "0.1.0"
description = "ADOS plugin: minimal heuristic detector proving the shared vision frame bus end to end"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.entry-points."ados.plugins"]
"com.altnautica.object-detector-demo" = "altnautica_object_detector_demo.plugin:ObjectDetectorDemoPlugin"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/altnautica_object_detector_demo"]

[tool.hatch.build.targets.sdist]
include = [
  "src/altnautica_object_detector_demo",
  "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
