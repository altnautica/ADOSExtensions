# Navigation's LiDAR and VIO half: planar scan matching, KISS-ICP and Basalt
# VIO pose providers, the RPLIDAR and Livox drivers, and the live navigation
# map. Runs as the extension's lidar-slam service.
[package]
name = "navigation-lidar-slam"
version = "1.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ADOS Navigation: LiDAR and VIO pose providers, LiDAR drivers and the live navigation map."

[lib]
name = "navigation_lidar_slam"
path = "src/lib.rs"

[[bin]]
name = "navigation-lidar-slam"
path = "src/main.rs"

[dependencies]
ados-mapping-protocol = { workspace = true }
ados-mapping-pose = { workspace = true }
ados-mapping-transport = { workspace = true }
ados-capture-contract = { workspace = true }
ados-protocol = { workspace = true }
ados-sdk = { workspace = true }
ados-sensorbus = { workspace = true }
ados-livox = { path = "livox" }
ados-rplidar = { path = "rplidar" }
ados-scan2d = { workspace = true }
ados-livemap = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Opens librealsense2 at run time for the RealSense depth source.
libloading = "0.8"

[features]
default = ["livox-sdk"]
# Drive a Livox LiDAR through the SDK2 shared library (Linux).
livox-sdk = ["ados-livox/sdk"]

[dev-dependencies]
ados-mapping-pose = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
# The scan2d_replay example.
anyhow = { workspace = true }
zstd = "0.13"
