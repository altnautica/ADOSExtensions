[package]
name = "hello-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal Rust agent-half example: links the plugin SDK and runs an empty plugin through the lifecycle runner. Proves the Rust extension toolchain end to end."

# The compiled binary is the manifest entrypoint. The plugin host execs it
# directly under systemd and hands it the per-plugin socket; the binary name is
# referenced from manifest.yaml as `agent.entrypoint: bin/hello-rust`.
[[bin]]
name = "hello-rust"
path = "src/main.rs"

[dependencies]
# The SDK brings the IPC client, the plugin-facing context facade, the
# lifecycle runner, and (transitively, through ados-protocol) the wire and the
# vision framebus contract.
ados-sdk = { workspace = true }
tokio = { workspace = true }
rmpv = { workspace = true }
# The SDK's `Plugin` lifecycle trait uses async methods, so implementing it
# needs the same `#[async_trait]` attribute the trait was declared with.
async-trait = { workspace = true }
