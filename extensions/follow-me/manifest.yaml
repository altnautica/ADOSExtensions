schema_version: 3
id: com.altnautica.follow-me
name: "ADOS Follow-Me"
version: "0.4.8"
description: "Lock onto an operator-designated subject and follow it at a distance and an angle (behind, side or lead) or orbit it, flown by the agent's pilot with obstacle avoidance. A flight Skill in the cockpit skill picker, a click-a-target Follow action, and a per-drone settings tab."
description_long: |
  Click a subject in the live video and the drone follows it at a set
  distance and height above the ground. A generic person/object detector on
  the companion produces detections; the operator designates one; the
  companion locks onto that track, estimates the subject's position from the
  box (ground intersection of the feet, box height, and an optional planar
  lidar return, fused by their uncertainty), tracks its velocity with a
  Kalman filter, and sends follow goals (position, velocity feed-forward,
  yaw and the subject) to the agent's pilot at 20 Hz under a motion lease.
  The pilot flies them through its obstacle planner, speed limits and
  geofence. A downward rangefinder on the flight controller keeps the follow
  height above the terrain.

  Two modes: Follow holds a distance and an angle from the subject's travel
  heading (180 behind, 90 on its right, 0 leading); Orbit circles the subject
  at a radius and an angular rate, clockwise or counter-clockwise. While it
  flies, the operator's sticks nudge the parameters: right stick sideways the
  angle (or orbit rate), right stick forward and back the distance (or
  radius), left stick up and down the height. A pause, a land, an RTH, a full
  stick takeover or an FC mode change hands the vehicle back to the pilot,
  which holds, and the skill switches off.

  A lock-state safety gate stops commanding when the tracker reports the
  subject uncertain or lost. On a loss the re-acquire mode decides: Strict
  holds and waits for the operator to designate again; Smart coasts on the
  prediction for a few seconds and, if a person matching the subject's
  appearance appears where the subject should be, designates it and
  announces the re-acquire. The engine never re-locks silently.

  Requires the agent's pilot (a multirotor, or a VTOL in hover). Works with
  a forward or downward camera; points a gimbal at the subject when one is
  present.
features:
  - "Click a detected subject in the cockpit and pick Follow to designate it"
  - "Follow at a distance and an angle (behind, side, lead) or orbit the subject"
  - "Obstacle avoidance by the agent's pilot: detours that keep the subject in view"
  - "Stick nudges for angle, distance, height, orbit radius and rate while following"
  - "Terrain-following height from a downward rangefinder, barometric fallback"
  - "Range from the feet ray, the box height and an optional planar lidar, fused by uncertainty"
  - "Strict or Smart re-acquire after an occlusion, operator selectable"
  - "Lock-state safety gate: stops commanding on uncertain or lost"
  - "Optional gimbal point-at-subject when a gimbal is present"
  - "Live read-back: phase, lock, range with uncertainty, height source, latency"
hardware_requirements:
  cameras: "USB UVC or CSI camera bound to the vision pipeline"
  fc_firmware: "ArduPilot or PX4, flown by the agent's pilot in guided mode"
  boards: ["cm4", "cm5", "rock-5c-lite", "rk3588s2", "rk3576", "rpi5", "cubie-a7s", "cubie-a7z"]
resource_impact:
  output_rate_hz: 20
  cpu_percent_peak: 25
  ram_mb: 128
  pids: 4
  startup_time_seconds: 3
telemetry_fields:
  - "follow.state"
documentation_url: "https://docs.altnautica.com/drone-agent/extensions-catalog#ados-follow-me"
author: "Altnautica"
homepage: "https://github.com/altnautica/ADOSExtensions/tree/main/extensions/follow-me"
license: "GPL-3.0-or-later"
risk: high

compatibility:
  # The pilot's motion lease, goals and stick feed (flight.motion) arrive in
  # 0.109.0.
  ados_version: ">=0.109.0"
  gcs_version: ">=0.56.0"
  supported_boards: ["cm4", "cm5", "rock-5c-lite", "rk3588s2", "rk3576", "rpi5", "cubie-a7s", "cubie-a7z"]

agent:
  runtime: python
  entrypoint: "follow_me:FollowMePlugin"
  isolation: subprocess
  per_drone_config: true
  permissions:
    - id: vision.detection.subscribe
    # Smart re-acquire designates the matching track with the engine, and the
    # follow-camera detection lease is requested under the same capability.
    - id: vision.track.designate
    - id: mavlink.read
    - id: mavlink.write
    # The pilot's motion lease: goals, the stick nudge feed and revocation.
    - id: flight.motion
    - id: event.publish
    # The optional planar scan the world-engine extension shares
    # (plugin.world-engine.scan, subscribe capability telemetry.read).
    - id: event.subscribe
    - id: telemetry.read
    - id: mcp.expose
  mavlink_components:
    # The companion's own component id: the gimbal pitch/yaw frames are
    # transmitted from it (ONBOARD_COMPUTER_COMP_ID in
    # agent/follow_me/mavlink_frames.py).
    - component_id: 191
      component_kind: generic
      sub_id: 0
  resources:
    max_ram_mb: 128
    max_cpu_percent: 25
    max_pids: 4
  contributes:
    # Conservative tools for an assistant: read the follow read-back, and stop
    # a follow. There is deliberately no start tool — a follow begins only when
    # an operator designates a subject in the cockpit.
    tools:
      - name: follow_status
        title: "Follow status"
        description: "Report the follow read-back: lock state, whether it is commanding, range, and setpoints."
        safety_class: read
        inputSchema:
          type: object
          properties: {}
      - name: stop_follow
        title: "Stop following"
        description: "Disarm the follow behaviour. Only ever stops; a follow is started by an operator designating a subject, never by a tool."
        safety_class: safe_write
        inputSchema:
          type: object
          properties: {}

gcs:
  entrypoint: "gcs/plugin.bundle.js"
  isolation: iframe
  permissions:
    - id: ui.slot.flight-skill
    - id: ui.slot.node-detail-tab
  contributes:
    skills:
      - id: follow-me
        label: "Follow-Me"
        icon: "crosshair"
        category: behavior
        toggle: true
        # Arming hands the vehicle to the follow, so the toggle confirms
        # before it arms rather than firing on a single keypress.
        confirm: true
        arm_requirement: armed
        # Commands the vehicle (holds the pilot's motion lease, preempted by
        # the built-ins) and takes the operator's sticks as nudges.
        motion: true
        nudge: true
        vehicle_classes: [multirotor, vtol]
        params:
          - follow_mode
          - follow_distance_m
          - follow_angle_deg
          - orbit_radius_m
          - orbit_rate_dps
          - orbit_direction
          - follow_height_m
        # The Skill Bar toggle is a distinct chord from the click-a-target
        # Follow action below so the two never share one key.
        default_binding:
          key: "shift+f"
        activation:
          via: config
          config_key: active
        state:
          via: event
          topic: "follow.state"
    # Cockpit target actions: click a detected subject in the host overlay and
    # pick Follow (or Stop following). The host owns the overlay, the box
    # drawing, the selection, and the designate + config write — this plugin
    # only declares the actions. "Follow this target" is bound to `f` on the
    # selected target and "Stop following" to `x`; both differ from the Skill
    # Bar toggle's shift+f.
    target_actions:
      - id: follow
        label: "Follow this target"
        icon: crosshair
        order: 20
        applies_to_class: person
        designate: true
        config_key: active
        config_value: true
        default_key: "f"
      - id: stop-follow
        label: "Stop following"
        icon: circle-stop
        order: 21
        applies_to_class: person
        designate: false
        config_key: active
        config_value: false
        default_key: "x"
    # The settings + live read-back tab on the drone's detail panel.
    tabs:
      - id: follow-me-tab
        slot: node.detail.tab
        profile: ["drone"]
        title: "Follow-Me"
        icon: "crosshair"
        order: 70
    # Native, declarative follow settings. The GCS renders these controls;
    # the agent reads the same per-drone keys live each loop. `active` is not
    # here — it is the skill toggle, not an operator setting.
    parameters:
      - key: follow_mode
        binding: plugin.config
        schema:
          type: string
          enum: ["follow", "orbit"]
          default: "follow"
        ui:
          widget: enum
          label: "settings.followMode"
          group: "settings.title"
          order: 5
      - key: follow_distance_m
        binding: plugin.config
        schema:
          type: number
          minimum: 3
          maximum: 30
          step: 0.5
          default: 8
        ui:
          widget: range
          label: "settings.followDistance"
          group: "settings.title"
          order: 10
          visible_if: { key: follow_mode, equals: "follow" }
      # The follow angle from the subject's travel heading: 180 behind, 90 on
      # its right, 270 on its left, 0 leading.
      - key: follow_angle_deg
        binding: plugin.config
        schema:
          type: number
          minimum: 0
          maximum: 355
          step: 5
          default: 180
        ui:
          widget: range
          label: "settings.followAngle"
          group: "settings.title"
          order: 12
          visible_if: { key: follow_mode, equals: "follow" }
      - key: orbit_radius_m
        binding: plugin.config
        schema:
          type: number
          minimum: 3
          maximum: 30
          step: 0.5
          default: 8
        ui:
          widget: range
          label: "settings.orbitRadius"
          group: "settings.title"
          order: 14
          visible_if: { key: follow_mode, equals: "orbit" }
      - key: orbit_rate_dps
        binding: plugin.config
        schema:
          type: number
          minimum: 2
          maximum: 30
          step: 1
          default: 10
        ui:
          widget: range
          label: "settings.orbitRate"
          group: "settings.title"
          order: 16
          visible_if: { key: follow_mode, equals: "orbit" }
      - key: orbit_direction
        binding: plugin.config
        schema:
          type: string
          enum: ["cw", "ccw"]
          default: "cw"
        ui:
          widget: enum
          label: "settings.orbitDirection"
          group: "settings.title"
          order: 18
          visible_if: { key: follow_mode, equals: "orbit" }
      - key: follow_height_m
        binding: plugin.config
        schema:
          type: number
          minimum: 0
          maximum: 20
          step: 0.5
          default: 4
        ui:
          widget: range
          label: "settings.followHeight"
          group: "settings.title"
          order: 20
      - key: gimbal_point
        binding: plugin.config
        schema:
          type: boolean
          default: true
        ui:
          widget: boolean
          label: "settings.gimbalPoint"
          group: "settings.title"
          order: 30
      - key: camera_hfov_deg
        binding: plugin.config
        schema:
          type: number
          minimum: 30
          maximum: 160
          step: 1
          default: 70
        ui:
          widget: number
          label: "settings.cameraHfov"
          group: "settings.title"
          order: 40
      # Fixed downward tilt of the designate camera below the horizon. A
      # forward camera needs a positive tilt for the image-to-ground
      # projection to intersect; 90 is straight down. The default is a modest
      # forward-down angle so a fresh install can resolve a ground point.
      - key: mount_pitch_deg
        binding: plugin.config
        schema:
          type: number
          minimum: 0
          maximum: 90
          step: 1
          default: 30
        ui:
          widget: range
          label: "settings.mountPitch"
          group: "settings.title"
          order: 42
      # What happens when the lock on the subject is lost. Two values, so
      # surfaces render it as a STRICT | SMART toggle. strict: hold and wait for
      # the operator to designate again. smart: coast on the prediction for
      # reacquire_window_s and designate a person that matches the subject's
      # appearance and predicted position, announcing it.
      - key: reacquire_mode
        binding: plugin.config
        schema:
          type: string
          enum: ["strict", "smart"]
          default: "smart"
        ui:
          widget: enum
          label: "settings.reacquireMode"
          group: "settings.title"
          order: 60
      - key: reacquire_window_s
        binding: plugin.config
        schema:
          type: number
          minimum: 0.5
          maximum: 15
          step: 0.5
          default: 4
        ui:
          widget: range
          label: "settings.reacquireWindow"
          group: "settings.title"
          order: 62
          visible_if: { key: reacquire_mode, equals: "smart" }
      - key: reacquire_min_similarity
        binding: plugin.config
        schema:
          type: number
          minimum: 0.5
          maximum: 0.99
          step: 0.01
          default: 0.75
        ui:
          widget: range
          label: "settings.reacquireMinSimilarity"
          group: "settings.title"
          order: 64
          visible_if: { key: reacquire_mode, equals: "smart" }
      # Cap on the velocity feed-forward handed to the flight controller.
      - key: max_speed_mps
        binding: plugin.config
        schema:
          type: number
          minimum: 0.5
          maximum: 15
          step: 0.5
          default: 6
        ui:
          widget: range
          label: "settings.maxSpeed"
          group: "settings.title"
          order: 70
      # The clearance the pilot's planner keeps from obstacles while this
      # skill flies (overrides the pilot's default margin).
      - key: obstacle_margin_m
        binding: plugin.config
        schema:
          type: number
          minimum: 0.8
          maximum: 5
          step: 0.1
          default: 1.5
        ui:
          widget: range
          label: "settings.obstacleMargin"
          group: "settings.title"
          order: 72
      # The camera whose detections the follow loop consumes. A registry
      # picker: the operator pins a camera or leaves it on auto (the first
      # detect camera → any camera for the detection filter).
      - key: designate_camera
        control: camera-selector
        binding: agent.config
        label: "settings.designateCamera"
        purpose: detect
        default: "auto"
        ui:
          group: "settings.title"
          order: 45
      # The detection model the follow loop consumes. A model picker bound to
      # the shared vision detector; it lists every registered detection model,
      # including the generic person model this plugin contributes.
      - key: detector
        binding: engine.detector
        schema:
          type: string
          default: "coco-person"
        ui:
          widget: model
          task: detection
          label: "settings.detector"
          group: "settings.title"
          order: 50
    # The generic person/COCO detection model the picker offers.
    models:
      - id: coco-person
        task: detection
        board_variants:
          - board_match: rk3588
            runtime: rknn
            input: "640x640"
            min_tops: 6
          - board_match: cpu
            runtime: onnx
            input: "640x640"
  locales:
    - en
