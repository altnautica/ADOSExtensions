# Reconstruct's drone-side process: perception offload to a paired node, the
# live scan stream for a node-built map, and the reconstruction MCP tools.
[package]
name = "reconstruct-offload"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ADOS Reconstruct on a drone: perception offload, the live scan stream to a reconstruction node, and the reconstruction tools."
publish = false

[lib]
name = "reconstruct_offload"
path = "src/lib.rs"

[[bin]]
name = "reconstruct-offload"
path = "src/main.rs"

[dependencies]
ados-mapping-protocol = { workspace = true }
ados-mapping-transport = { workspace = true }
ados-protocol = { workspace = true }
ados-sdk = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
parking_lot = { workspace = true }
rmpv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The LAN egress address the RTSP URL handed to the node names.
socket2 = { workspace = true }

[dev-dependencies]
ados-mapping-transport = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
