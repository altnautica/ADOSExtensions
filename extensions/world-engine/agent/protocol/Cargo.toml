# World Engine wire contract: the Atlas world-model envelope and descriptors,
# the compute-node job and cluster types, and the perception-offload batch
# types. Pure serde types with no I/O, shared by every World Engine binary
# (capture, link, node) so the drone, ground-station and compute halves speak
# one vocabulary.
[package]
name = "world-engine-protocol"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "World Engine wire contract: Atlas world-model envelope and descriptors, compute-node job types, and perception-offload batches."

[lib]
name = "world_engine_protocol"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
