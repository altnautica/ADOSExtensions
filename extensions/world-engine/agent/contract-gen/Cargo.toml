# Rust bindings for the MIT capture contract in `../../contract/`: types
# generated at build time from the JSON Schemas (typify) and the protobuf
# messages (prost, compiled in-process by protox, so no system protoc), plus
# the MCAP session writer and reader every World Engine binary uses.
[package]
name = "ados-capture-contract"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ADOS capture contract (ados.capture/1): generated schema and protobuf types plus the MCAP session writer and reader."
build = "build.rs"

[lib]
name = "ados_capture_contract"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
prost = "0.14"
prost-types = "0.14"
mcap = { version = "0.25", default-features = false, features = ["lz4"] }
blake3 = "1"
memmap2 = "0.9"

[build-dependencies]
typify = { version = "0.8", default-features = false }
schemars = "0.8"
serde_json = { workspace = true }
syn = "3"
prettyplease = "0.3"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"

[dev-dependencies]
jsonschema = { version = "0.59", default-features = false }
tempfile = { workspace = true }
