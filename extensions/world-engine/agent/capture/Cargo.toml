# World Engine capture service (drone): reads engine frames and the flight
# controller pose through the plugin host, selects pose-tagged keyframes, and
# publishes the keyframe + pose + capture-state streams on the extension's
# private atlas bus for the link to forward.
[package]
name = "world-engine-capture"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "World Engine capture: pose-tagged keyframe selection on the drone, one camera up to an all-sides rig."

[lib]
name = "world_engine_capture"
path = "src/lib.rs"

# Declared as the `capture` service in manifest.yaml
# (`bin:world-engine-capture com.altnautica.world-engine`).
[[bin]]
name = "world-engine-capture"
path = "src/main.rs"

[dependencies]
world-engine-protocol = { path = "../protocol" }
ados-sdk = { workspace = true }
# The vision framebus value types and the Unix-socket framing the atlas bus,
# control socket and offload-pose reader speak.
ados-protocol = { workspace = true }
# The link-aware freshness gate the capture path age-gates each pose with.
ados-offload = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
# Encode a selected keyframe's raw frame to JPEG before it ships to the compute
# node (a reconstructor ingests compressed images, never raw planes).
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
tempfile = { workspace = true }
