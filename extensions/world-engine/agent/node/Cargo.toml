# World Engine compute node (workstation / compute profiles): the job store,
# scheduler and reconstruction pipeline, the Atlas ingest and world-model
# fan-out, the perception-offload serving side, node credentials, and its
# job-API mDNS advert (published through the host).
[package]
name = "world-engine-node"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "World Engine compute node: reconstruction jobs, world-model streaming, and perception offload serving for drones on the LAN."

[lib]
name = "world_engine_node"
path = "src/lib.rs"

# Declared as the `node` service in manifest.yaml
# (`bin:world-engine-node com.altnautica.world-engine`).
[[bin]]
name = "world-engine-node"
path = "src/main.rs"

[dependencies]
world-engine-protocol = { path = "../protocol" }
ados-capture-contract = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmpv = { workspace = true }
rmp-serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true, features = ["ws"] }
hyper = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
# Rerun logging SDK, pinned to =0.33.1 to match the GCS web-viewer
# (@rerun-io/web-viewer@0.33.1) exactly: the .rrd encoding carries a version the
# viewer checks. Write-only feature set: `sdk` gives `RecordingStream` and the
# archetypes, with the viewer, analytics, importers and gRPC server dropped.
rerun = { version = "=0.33.1", default-features = false, features = ["sdk"] }
tower-http = { workspace = true, features = ["fs"] }
sha2 = { workspace = true }
hex = { workspace = true }
# Total/unified-memory read for the macOS host-GPU block.
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk"] }
# Reconstruction products: LAZ 1.4 point clouds, the tour bundle zip, image
# export of recorded frames, Kalibr YAML import and the k-d tree behind cloud
# comparisons.
las = { version = "0.11", features = ["laz"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_yaml_ng = "0.10"
kiddo = "6"
getrandom = "0.3"
# ROS 2 bag export for the LiDAR-camera calibration container.
mcap = { version = "0.25", default-features = false }
# Commit-time validation of uploaded session documents against the contract.
jsonschema = { version = "0.59", default-features = false }
# Planar LiDAR-camera calibration: the AprilGrid board detector (pure Rust)
# and the small dense solves (board pose, extrinsic least squares).
aprilgrid = "0.8"
nalgebra = "0.33"
# A planar LiDAR session's trajectory (scan matching, loop closure).
ados-scan2d = { path = "../scan2d" }

# Owner-only DACLs on the standalone node's secret files.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

# The plugin host, the agent wire and the Atlas transport are unix-only (they
# speak unix sockets); a Windows build is the standalone reconstruction node.
[target.'cfg(unix)'.dependencies]
# The Atlas event receiver, the world-model WebSocket fan-out, the compute-node
# service type and TXT record, and the compute client the offload tests drive.
world-engine-transport = { path = "../transport" }
# The plugin host connection (plugin config, telemetry.extend) when the node
# runs as the extension's `node` service.
ados-sdk = { workspace = true }
# Node-credential helpers, the mDNS reach rule, rustls provider install.
ados-protocol = { workspace = true, features = ["tls"] }
# The real perception-offload detector: ados-vision-engine's ONNX backend (the same
# YOLO decode a drone runs on its NPU). Optional so a CPU-only build needs no
# ONNX Runtime; `coreml` adds the Apple-GPU execution provider.
ados-vision-engine = { workspace = true, optional = true }

[features]
default = []
# Build the real ONNX detector hosted on ados-vision-engine's backend.
onnx = ["dep:ados-vision-engine", "ados-vision-engine/onnx"]
# Register the CoreML execution provider so ONNX inference runs on the Apple GPU
# (macOS workstation). Implies `onnx`.
coreml = ["onnx", "ados-vision-engine/coreml"]
# Stand-in tool runners (no COLMAP / trainer / converter on the host) for the
# pipeline integration test and the stand-in reconstructor. Never in a release
# build.
mock = []

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }
axum = { workspace = true }
# The offload gate implements the transport's detection-publisher trait.
async-trait = { workspace = true }
# Integration tests drive the stand-in tool runners.
world-engine-node = { path = ".", features = ["mock"] }
# Upload tests build `checksums.b3` listings.
blake3 = "1"

[target.'cfg(unix)'.dev-dependencies]
ados-offload = { workspace = true }
