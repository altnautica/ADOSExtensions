[project]
name = "gsplat-train"
version = "0.1.0"
description = "Gaussian splat training, splat meshing, depth, masks and still rendering for the reconstruction node"
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.7",
  "torchvision>=0.22",
  "gsplat==1.5.3",
  "numpy>=1.26",
  "plyfile>=1.0",
  "open3d>=0.19",
  "opencv-python-headless>=4.10",
  "onnxruntime>=1.19",
  "laspy[lazrs]>=2.5",
  "pillow>=10",
  "moge @ git+https://github.com/microsoft/MoGe.git@b942f00bdc2a2a23ebb474fbe034d487e6dcceec",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
# moge 2.0.0 pulls the GUI demo stack and the non-headless OpenCV build; the
# scripts here use neither, and opencv-python-headless provides cv2.
override-dependencies = [
  "gradio ; sys_platform == 'never'",
  "opencv-python ; sys_platform == 'never'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[dependency-groups]
dev = [
    "pytest>=8",
]
