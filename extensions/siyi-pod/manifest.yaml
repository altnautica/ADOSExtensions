schema_version: 2
id: com.altnautica.siyi-pod
name: "ADOS SIYI Optical Pod"
version: "0.2.0"
description: "Native driver for the SIYI optical-pod line (A2 mini, A8 mini, ZR10, ZR30, ZT6, ZT30) with per-model capability negotiation: gimbal, zoom, focus, photo/record, thermal palette and spot temperature, laser rangefinder with subject geolocation, and on-pod AI tracking."
description_long: |
  Speaks the SIYI Gimbal Camera External SDK over UDP, TCP, or a TTL serial port
  directly, so the agent drives the features a stock autopilot mount cannot:
  thermal palettes and temperature, the laser rangefinder, subject geolocation,
  and AI tracking. On start the plugin queries firmware and the hardware id,
  resolves the exact model's capability profile, and exposes only the controls
  that model supports. The pod's own tracker box is republished onto the shared
  detection bus so cockpit click-to-track and follow behaviours work with no
  on-board accelerator. The laser range plus the gimbal angles and the flight
  controller pose resolve a subject latitude and longitude that drops a marker on
  the map. Gimbal attitude and the laser range are mirrored up to the flight
  controller as standard MAVLink so the built-in gimbal panel lights up too.
features:
  - "Auto-detects A2 mini / A8 mini / ZR10 / ZR30 / ZT6 / ZT30 and negotiates capabilities"
  - "Gimbal aim, rate, recenter, and lock/follow/FPV modes"
  - "Optical and absolute zoom, autofocus (zoom models)"
  - "Thermal palette, gain, and spot temperature (thermal models)"
  - "Laser rangefinder with subject geolocation on the map (laser models)"
  - "On-pod AI tracking republished to the cockpit (no accelerator required)"
hardware_requirements:
  cameras: "A SIYI optical pod (A2 mini, A8 mini, ZR10, ZR30, ZT6, or ZT30) on the pod network (192.168.144.x) or a TTL serial port"
  boards: ["cm4", "cm5", "rk3582", "rk3588s2", "rk3576", "rpi5", "x86"]
resource_impact:
  cpu_percent_peak: 12
  ram_mb: 96
  pids: 4
  output_rate_hz: 5
  startup_time_seconds: 3
telemetry_fields:
  - "siyi"
documentation_url: "https://docs.altnautica.com/drone-agent/siyi-pod-overview"
author: "Altnautica"
homepage: "https://github.com/altnautica/ADOSExtensions/tree/main/extensions/siyi-pod"
license: "GPL-3.0-or-later"
risk: high

compatibility:
  ados_version: ">=0.99.177"
  gcs_version: ">=0.56.0"
  supported_boards: ["cm4", "cm5", "rk3582", "rk3588s2", "rk3576", "rpi5", "x86"]

agent:
  runtime: python
  entrypoint: "altnautica_siyi_pod.plugin:SiyiPodPlugin"
  isolation: subprocess
  per_drone_config: true
  permissions:
    - id: network.outbound
    - id: hardware.uart
    - id: mavlink.read
    - id: mavlink.write
    - id: mavlink.component.gimbal
    - id: mavlink.component.camera
    - id: sensor.camera.register
    - id: vision.detection.publish
    - id: vision.track.designate
    - id: telemetry.extend
    - id: video.source.set
    - id: event.publish
    - id: event.subscribe
  resources:
    max_ram_mb: 128
    max_cpu_percent: 25
    max_pids: 4
  mavlink_components:
    - component_id: 154
      component_kind: gimbal
      sub_id: 0
    - component_id: 100
      component_kind: camera
      sub_id: 1

gcs:
  entrypoint: "gcs/plugin.bundle.js"
  isolation: iframe
  permissions:
    - id: ui.slot.node-detail-tab
    - id: ui.slot.cockpit-panel
    - id: ui.slot.video-overlay
    - id: ui.slot.flight-skill
    - id: ui.slot.settings-section
    - id: ui.slot.map-overlay
    - id: ui.slot.notification-channel
    - id: ui.slot.mission-template
    - id: telemetry.subscribe.siyi
    - id: command.send
    - id: recording.write
    - id: mission.read
    - id: mission.write
  contributes:
    tabs:
      - id: siyi-console
        slot: node.detail.tab
        profile: ["drone"]
        title: "SIYI Pod"
        icon: "camera"
        order: 55
    panels:
      - id: siyi-cockpit
        slot: cockpit.panel
        title: "Pod"
        icon: "camera"
        order: 40
      - id: siyi-overlay
        slot: video.overlay
        title: "SIYI pod HUD"
        icon: "crosshair"
      - id: siyi-map
        slot: map.overlay
        title: "Laser target"
        icon: "target"
    notifications:
      - id: siyi-health
        title: "SIYI pod health"
        severity: warning
    skills:
      - id: siyi-track
        label: "skill.track"
        icon: "crosshair"
        category: camera
        toggle: true
        confirm: false
        arm_requirement: any
        default_binding: { key: "t" }
        activation: { via: config, config_key: track_active }
        state: { via: event, topic: "siyi.pod.state" }
      - id: siyi-record
        label: "skill.record"
        icon: "video"
        category: camera
        toggle: true
        confirm: false
        arm_requirement: any
        default_binding: { key: "r" }
        activation: { via: config, config_key: recording }
        state: { via: event, topic: "siyi.pod.state" }
    target_actions:
      - id: siyi-designate
        label: "Track with pod"
        icon: crosshair
        order: 25
        designate: true
        config_key: track_designate
        config_value: true
        default_key: "t"
    parameters:
      - key: zoom
        binding: plugin.config
        schema: { type: number, minimum: 1, maximum: 30, step: 0.1, default: 1 }
        ui: { widget: range, label: "settings.zoom", group: "settings.optics", order: 10 }
      - key: gimbal_mode
        binding: plugin.config
        schema: { type: string, enum: ["lock", "follow", "fpv"], default: "follow" }
        ui: { widget: enum, label: "settings.gimbalMode", group: "settings.gimbal", order: 30 }
      - key: palette
        binding: plugin.config
        schema: { type: integer, minimum: 0, maximum: 8, default: 0 }
        ui: { widget: number, label: "settings.palette", group: "settings.thermal", order: 40 }
      - key: thermal_gain
        binding: plugin.config
        schema: { type: boolean, default: true }
        ui: { widget: boolean, label: "settings.gain", group: "settings.thermal", order: 50 }
      - key: laser_enabled
        binding: plugin.config
        schema: { type: boolean, default: false }
        ui: { widget: boolean, label: "settings.laser", help: "settings.laserHelp", group: "settings.laser", order: 60 }
  locales:
    - en
