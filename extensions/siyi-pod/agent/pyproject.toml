[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "altnautica-siyi-pod"
version = "0.4.0"
description = "ADOS plugin: SIYI optical-pod driver (agent half)."
readme = "../README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Altnautica" }]
keywords = ["ados", "plugin", "siyi", "gimbal", "camera", "driver"]
dependencies = [
    # Provided by the host agent venv at runtime; declared here so a
    # standalone checkout can run the unit tests. Used only by the MAVLink
    # bridge to pack the gimbal/camera/rangefinder frames the pod mirrors
    # up to the flight controller.
    "pymavlink>=2.4.41",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.entry-points."ados.plugins"]
"com.altnautica.siyi-pod" = "altnautica_siyi_pod.plugin:SiyiPodPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/altnautica_siyi_pod"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
